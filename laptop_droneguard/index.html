<!doctype html><html><head><meta charset="utf-8"><title>DroneGuard Laptop</title><style>
body{font:16px system-ui;background:#07111e;color:#e7eef8;margin:0;padding:28px}h1{margin:0 0 4px}.sub{color:#9db0c9}.toolbar{display:flex;gap:10px;margin:22px 0}button{border:0;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#55d98d;color:#062617}button.secondary{background:#27425f;color:#e7eef8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.card,.panel{background:#102238;border:1px solid #27425f;border-radius:12px;padding:16px}.label{color:#9db0c9;font-size:13px}.value{font-size:28px;font-weight:700;margin-top:5px}.ok{color:#55d98d}.warn{color:#ffd166}.alarm{color:#ff6b6b}.panel{margin:18px 0}.panel h2{font-size:16px;margin:0 0 10px}.log{margin:0;padding-left:20px;color:#c9d6e8;line-height:1.7;min-height:30px}canvas{background:#102238;border:1px solid #27425f;border-radius:12px;width:100%;height:270px}
</style></head><body><h1>DroneGuard <span class="sub">Laptop Mission Control</span></h1><div class="sub">Standalone simulation · ready to replace with live MAVLink telemetry</div><div class="toolbar"><button id="start" onclick="start()">Start simulation</button><button class="secondary" onclick="resetSim()">Reset</button></div><div class="grid" id="cards"></div><canvas id="chart" width="1000" height="270"></canvas><section class="panel"><h2>Mission event log</h2><ol class="log" id="log"></ol></section><script>
const fields=[['state','Mission state'],['distance_m','Distance from home',' m'],['speed_mps','Speed',' m/s'],['soc','Battery charge',' %'],['voltage_v','Battery voltage',' V'],['current_a','Motor current',' A'],['motor_temp_c','Motor temperature',' °C'],['overall_health','Overall health',' / 100'],['rth_threshold','Return-home threshold',' %']];
function draw(h){let c=document.querySelector('#chart'),x=c.getContext('2d'),w=c.width,H=c.height,L=55,R=20,T=35,B=32;x.clearRect(0,0,w,H);x.fillStyle='#9db0c9';x.font='14px system-ui';x.fillText('Battery charge vs required return-home threshold',L,20);for(let pct=0;pct<=100;pct+=25){let y=H-B-(pct/100)*(H-T-B);x.strokeStyle='#27425f';x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#9db0c9';x.fillText(pct+'%',12,y+4)}if(!h.length){x.fillStyle='#9db0c9';x.fillText('Press Start simulation to collect telemetry.',L+20,H/2);return}let start=h[0].time_s,end=h[h.length-1].time_s,span=Math.max(1,end-start);for(let [key,color] of [['soc','#55d98d'],['rth_threshold','#ffd166']]){x.strokeStyle=color;x.lineWidth=3;x.beginPath();h.forEach((p,i)=>{let X=L+(p.time_s-start)/span*(w-L-R),Y=H-B-p[key]*(H-T-B);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}x.fillStyle='#9db0c9';x.fillText('Mission time: '+start+'–'+end+' s',L,H-9);x.fillStyle='#55d98d';x.fillText('● charge',w-175,20);x.fillStyle='#ffd166';x.fillText('● threshold',w-90,20)}
async function start(){await fetch('/api/start',{method:'POST'});refresh()}async function resetSim(){await fetch('/api/reset',{method:'POST'});refresh()}async function refresh(){let d=await fetch('/api/status').then(r=>r.json()),t=d.telemetry;document.querySelector('#start').disabled=d.running;document.querySelector('#start').textContent=d.running?'Simulation running':'Start simulation';document.querySelector('#cards').innerHTML=fields.map(([k,l,u=''])=>{let v=t[k];if(k==='soc'||k==='rth_threshold')v=(v*100).toFixed(1);else if(typeof v==='number')v=v.toFixed(1);let cls=k==='state'?(t.alert==='ALARM'?'alarm':t.alert==='WARN'?'warn':'ok'):'';return `<div class="card"><div class="label">${l}</div><div class="value ${cls}">${v}${u}</div></div>`}).join('')+`<div class="card"><div class="label">Decision</div><div class="value">${t.reason}</div></div>`;document.querySelector('#log').innerHTML=d.events.slice().reverse().map(e=>`<li><b>${e.time_s}s:</b> ${e.message}</li>`).join('');draw(d.history)}refresh();setInterval(refresh,1000);
</script></body></html>
